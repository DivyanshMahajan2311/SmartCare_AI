<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare AI for Teens</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ----------------- Global Styles ----------------- */
* {
    box-sizing: border-box;
    font-family: 'Roboto', sans-serif;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
    background-size: 400% 400%;
    animation: gradientBG 20s ease infinite;
}

/* Animated gradient background */
@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* ----------------- Particle Background ----------------- */
#particle-canvas {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

/* ----------------- Header & Navigation ----------------- */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #ff6ec7cc;
    color: white;
    padding: 15px 20px;
    font-size: 1.8rem;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 10;
}

nav {
    display: flex;
    gap: 10px;
}

/* keep same styling but apply to anchors now */
nav a {
    text-decoration: none;
    display: inline-block;
    background: none;
    border: none;
    padding: 10px 18px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    color: white;
    font-weight: bold;
    position: relative;
}

nav a:hover, nav a.active {
    background-color: #ffd966;
    color: #ff3b9f;
    border-radius: 8px;
    transform: translateY(-3px);
}

/* ----------------- Main & Sections ----------------- */
main {
    flex: 1;
    padding: 30px;
    position: relative;
    z-index: 5; /* above particle canvas */
}

section {
    display: none;
    animation: fadeIn 1s ease forwards;
}

section.active {
    display: block;
}

/* Fade-in animation for sections */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* ----------------- Personal Care Cards ----------------- */
.care-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 80px;
}

.care-card {
    background: rgba(255, 255, 255, 0.9);
    padding: 20px;
    width: 320px;
    height: 180px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
    backdrop-filter: blur(8px);
}

.care-card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

.care-card h3 {
    margin-bottom: 10px;
    color: #ff3b9f;
}

/* ----------------- Emotion Options (NEW) ----------------- */
.emotion-options {
    display: none; /* hidden by default */
    margin-top: 12px;
    gap: 8px;
    flex-wrap: wrap;
}

.care-card.open .emotion-options {
    display: flex; /* show when parent has .open */
}

.emotion-option-btn {
    padding: 8px 12px;
    border-radius: 10px;
    border: 2px solid #ffb3e6;
    background: rgba(255,255,255,0.95);
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.15s, background-color 0.2s;
}

.emotion-option-btn:hover {
    transform: translateY(-3px);
    background-color: #fff0f7;
}

/* ----------------- Chatbot ----------------- */
.chat-container {
    max-width: 600px;
    margin: 0 auto;
    background-color: rgba(255,255,255,0.95);
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    backdrop-filter: blur(8px);
}

.chat-box {
    height: 300px;
    overflow-y: auto;
    border: 1px solid #ffb3e6;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    background-color: #fff0f7;
}

.chat-input {
    display: flex;
}

.chat-input input {
    flex: 1;
    padding: 12px;
    border-radius: 10px 0 0 10px;
    border: 2px solid #ffb3e6;
    outline: none;
    transition: border 0.3s;
}

.chat-input input:focus {
    border-color: #ff3b9f;
}

.chat-input button {
    padding: 12px 20px;
    border: none;
    /* background-color: red; */
    color: #fff;
    cursor: pointer;
    border-radius: 0 10px 10px 0;
    transition: transform 0.2s, background-color 0.3s;
}

.chat-input button:hover {
    transform: translateY(-2px);
    background-color: #ff66c4;
}

.chat-message {
    margin: 5px 0;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 85%;
    word-wrap: break-word;
    opacity: 0;
    transform: translateY(10px);
    animation: messageAppear 0.4s forwards;
}

.chat-message.user {
    background-color: #ffd966;
    color: #ff3b9f;
    align-self: flex-end;
}

.chat-message.bot {
    background-color: #ffb3e6;
    color: #000;
    align-self: flex-start;
}

@keyframes messageAppear {
    to {opacity:1; transform: translateY(0);}
}

/* ----------------- Responsive ----------------- */
@media (max-width: 600px) {
    header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
    }
    nav { flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>

<!-- Particle Background Canvas -->
<canvas id="particle-canvas"></canvas>

<header>
    <div>SmartCare AI for Teens 🌟</div>
    <nav>
        <a class="tab-btn {% if active=='home' %}active{% endif %}" href="{{ url_for('home') }}">Home</a>
        <a class="tab-btn {% if active=='about' %}active{% endif %}" href="{{ url_for('about') }}">About</a>
        <a class="tab-btn {% if active=='personal-care' %}active{% endif %}" href="{{ url_for('personal_care') }}">Your Personal Care</a>
    </nav>
</header>


<main>
    {% block content %}{% endblock %}
</main>

<script>
// ----------------- Particle Animation (kept exactly) -----------------
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
const particleCount = 80;

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 5 + 2;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5;
        this.color = `rgba(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*200)}, 255, 0.7)`;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if(this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

function initParticles(){
    particles = [];
    for(let i=0;i<particleCount;i++){
        particles.push(new Particle());
    }
}
initParticles();

function animateParticles(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();
</script>

</body>
</html>
